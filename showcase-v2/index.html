<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020504" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="../app-icon.svg" type="image/svg+xml" />
  <title>LC App — Live Casino. Social Experience.</title>
  <style>
    :root {
      --bg: #020504;
      --panel: rgba(9, 17, 15, .74);
      --panel2: rgba(13, 28, 24, .84);
      --line: rgba(205, 255, 236, .12);
      --line2: rgba(205, 255, 236, .26);
      --text: #f7fffb;
      --soft: rgba(247, 255, 251, .78);
      --muted: rgba(247, 255, 251, .52);
      --mint: #96ffd7;
      --teal: #20dac9;
      --emerald: #073d32;
      --red: #ff4d5a;
      --radius: 8px;
      --radius-lg: 18px;
      --space-1: 4px;
      --space-2: 6px;
      --space-3: 8px;
      --space-4: 10px;
      --space-5: 12px;
      --space-6: 14px;
      --space-7: 18px;
      --touch: 44px;
      --touch-sm: 40px;
      --control-radius: 12px;
      --card-radius: 18px;
      --bottom-nav-height: 70px;
      --safe-bottom: env(safe-area-inset-bottom);
      --page-bottom-padding: calc(var(--bottom-nav-height) + var(--safe-bottom) + 30px);
      --app-h: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    @supports (height: 100svh) { :root { --app-h: 100svh; } }
    * { box-sizing: border-box; letter-spacing: 0; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 38% 16%, rgba(32,218,201,.2), transparent 34rem),
        radial-gradient(circle at 70% 78%, rgba(150,255,215,.09), transparent 30rem),
        linear-gradient(135deg, #07140f 0%, #020504 58%, #010202 100%);
    }
    button, a { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 46px; line-height: .94; }
    h2 { font-size: 27px; line-height: 1.03; }
    h3 { font-size: 16px; line-height: 1.18; }
    p { color: var(--soft); font-size: 13px; line-height: 1.45; }
    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(480px, .95fr) minmax(420px, .75fr);
      gap: clamp(64px, 7vw, 140px);
      align-items: center;
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      padding: clamp(28px, 4vw, 56px);
      position: relative;
      isolation: isolate;
    }
    .stage::before {
      content: "";
      position: fixed;
      inset: 8%;
      background: radial-gradient(circle at 38% 34%, rgba(32,218,201,.22), transparent 28rem);
      filter: blur(28px);
      opacity: .9;
      z-index: -1;
    }
    .phone {
      justify-self: end;
      width: auto;
      height: min(82vh, 900px);
      max-height: calc(100vh - clamp(56px, 8vh, 96px));
      aspect-ratio: 430 / 932;
      padding: 10px;
      border-radius: 34px;
      border: 1px solid rgba(150,255,215,.18);
      background: linear-gradient(145deg, rgba(11,24,20,.96), rgba(2,5,4,.98));
      box-shadow: 0 44px 150px rgba(0,0,0,.56), 0 0 90px rgba(32,218,201,.16), 0 0 0 1px rgba(32,218,201,.07) inset;
    }
    .app {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, #07110f 0%, #030605 100%);
    }
    .app::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      width: 112px;
      height: 30px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: #020403;
      z-index: 20;
    }
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 58px 16px var(--page-bottom-padding);
      scrollbar-width: none;
      background:
        radial-gradient(circle at 82% 0%, rgba(32,218,201,.1), transparent 18rem),
        linear-gradient(180deg, rgba(4, 14, 12, .98), rgba(2,5,4,1));
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active { display: block; animation: enter .2s ease-out; }
    .app[data-route="welcome"] .bottom-nav,
    .app[data-route="industry"] .bottom-nav { display: none; }
    .app[data-route="welcome"] .screen,
    .app[data-route="industry"] .screen { padding-bottom: 30px; }
    @keyframes enter { from { opacity: .45; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .screen * { min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-7); }
    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .logo {
      width: var(--touch-sm);
      height: var(--touch-sm);
      flex: 0 0 auto;
      border-radius: var(--control-radius);
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--mint), var(--teal));
      color: #021210;
      font-weight: 950;
      box-shadow: 0 14px 34px rgba(32,218,201,.22);
    }
    .brand strong { display: block; font-size: 14px; line-height: 1.05; white-space: nowrap; }
    .brand span { display: none; color: var(--muted); font-size: 7.5px; font-weight: 850; text-transform: uppercase; white-space: nowrap; }
    .top-actions { display: flex; align-items: center; gap: var(--space-2); flex: 0 0 auto; }
    .icon-btn {
      width: var(--touch);
      height: var(--touch);
      border-radius: var(--control-radius);
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: var(--soft);
      display: grid;
      place-items: center;
    }
    .avatar-action { width: var(--touch); height: var(--touch); padding: 0; border: 0; border-radius: var(--control-radius); background: transparent; overflow: hidden; }
    .avatar-mini { width: 100%; height: 100%; border-radius: var(--control-radius); object-fit: cover; border: 1px solid rgba(255,255,255,.12); }
    .label, .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: rgba(32,218,201,.1);
      color: var(--mint);
      font-size: 8.5px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .label.live, .pill.live { color: #ffd9dd; background: rgba(255,77,90,.14); border-color: rgba(255,77,90,.4); }
    .pill.soft { color: var(--soft); background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.1); }
    .demo-note { color: var(--muted); font-size: 9.5px; line-height: 1.35; }
    .btn {
      min-height: var(--touch);
      border: 0;
      border-radius: var(--control-radius);
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 920;
      color: #021210;
      background: linear-gradient(135deg, var(--mint), var(--teal));
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.secondary, .btn.following {
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.055);
      box-shadow: none;
    }
    .btn.following { color: var(--mint); border-color: rgba(150,255,215,.35); background: rgba(7,61,50,.5); }
    .btn.slim { min-height: var(--touch-sm); padding: 0 12px; font-size: 10.5px; }
    .cta-row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
    .filter-row {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip {
      min-height: 36px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      color: var(--soft);
      padding: 0 10px;
      font-size: 10.5px;
      font-weight: 820;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .chip.active, .btn.active { color: var(--mint); border-color: rgba(32,218,201,.45); background: rgba(32,218,201,.12); }
    .icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .section { display: grid; gap: var(--space-5); margin-top: 22px; }
    .section.subtle { gap: var(--space-4); }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 10px; }
    .section-head span { color: var(--muted); font-size: 9px; font-weight: 850; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }
    .pulse { position: relative; }
    .pulse::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 0 rgba(255,77,90,.45);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,90,.45); } 70% { box-shadow: 0 0 0 9px rgba(255,77,90,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,90,0); } }

    .image-frame { position: relative; overflow: hidden; background: #07100e; }
    .image-frame > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dealer-avatar { aspect-ratio: 1 / 1; border-radius: 12px; }
    .dealer-portrait { aspect-ratio: 3 / 4; border-radius: var(--radius-lg); }
    .dealer-hero { aspect-ratio: 4 / 5; border-radius: 22px; }
    .dealer-live { aspect-ratio: 16 / 11; border-radius: 22px; }
    .dealer-content { aspect-ratio: 16 / 10; border-radius: var(--radius-lg); }
    .room-hero { aspect-ratio: 16 / 11; border-radius: 22px; }

    .welcome { min-height: 100%; display: grid; align-content: end; gap: 14px; }
    .welcome-visual {
      position: relative;
      height: min(54svh, 480px);
      min-height: 390px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .welcome-visual img, .hero-live img, .portrait-tile img, .profile-hero img, .room-stage img, .image-post img, .profile-room img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .welcome-visual > img, .hero-live > img, .profile-hero > img, .room-stage > img, .image-post > img, .profile-room > img, .portrait-img img {
      position: absolute;
      inset: 0;
    }
    .welcome-visual img { object-position: center 18%; filter: saturate(1.04) contrast(1.04) brightness(.86); }
    .welcome-visual::after, .hero-live::after, .profile-hero::after, .room-stage::after, .image-post::after, .profile-room::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.02), rgba(2,5,4,.18) 42%, rgba(2,5,4,.83));
    }
    .welcome-copy { display: grid; gap: 9px; }
    .welcome-copy h1 { margin-top: 4px; }
    .welcome-copy p { color: var(--text); font-size: 15px; max-width: 34ch; }
    .text-link { min-height: var(--touch-sm); color: var(--muted); border: 0; background: none; padding: 0 2px; font-size: 11px; justify-self: start; }

    .hero-live {
      position: relative;
      aspect-ratio: 16 / 14;
      min-height: 330px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .hero-live img { object-position: center 30%; filter: saturate(1.06) contrast(1.04) brightness(.82); }
    .hero-content {
      position: absolute;
      inset: auto 13px 13px;
      z-index: 2;
      display: grid;
      justify-items: start;
      gap: 8px;
    }
    .hero-content h2 { font-size: 33px; }
    .creator-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .creator-strip::-webkit-scrollbar { display: none; }
    .live-rail { display: grid; gap: 9px; }
    .live-room-card {
      min-height: 74px;
      display: grid;
      grid-template-columns: 62px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 9px;
      border-radius: var(--card-radius);
      border: 1px solid rgba(150,255,215,.14);
      background: rgba(255,255,255,.045);
      color: var(--text);
      text-align: left;
    }
    .live-room-card img { width: 62px; height: 56px; object-fit: cover; border-radius: 14px; }
    .live-room-card b { display: block; font-size: 13px; }
    .live-room-card span { display: block; color: var(--muted); font-size: 10.5px; line-height: 1.3; }
    .portrait-tile {
      min-width: 98px;
      border: 0;
      color: var(--text);
      background: transparent;
      display: grid;
      gap: 8px;
      text-align: left;
    }
    .portrait-img {
      position: relative;
      aspect-ratio: 3 / 4;
      height: auto;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
      background: #07100e;
    }
    .portrait-img img { object-position: center 22%; filter: saturate(1.04) brightness(.88); }
    .portrait-tile b { display: block; font-size: 13px; }
    .portrait-tile span { display: block; color: var(--muted); font-size: 10px; line-height: 1.28; }
    .content-stack { display: grid; gap: 12px; }
    .image-post {
      position: relative;
      aspect-ratio: 16 / 10;
      min-height: 178px;
      border-radius: 18px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .image-post img { object-position: center 44%; filter: saturate(1.02) brightness(.76); }
    .post-body {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      display: grid;
      justify-items: start;
      gap: 7px;
    }
    .post-top { display: flex; align-items: center; gap: 8px; }
    .post-top img { width: 34px; height: 34px; object-fit: cover; border-radius: 11px; border: 1px solid rgba(255,255,255,.12); }
    .activity-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .activity-row:first-child { border-top: 0; }
    .activity-row img { width: 44px; height: 44px; border-radius: 13px; object-fit: cover; }
    .activity-row b { display: block; font-size: 13px; }
    .activity-row span { color: var(--muted); font-size: 11px; }
    .action-icons { display: flex; gap: 6px; align-items: center; }
    .round-action {
      width: var(--touch-sm);
      height: var(--touch-sm);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.045);
      color: var(--soft);
      display: grid;
      place-items: center;
    }
    .round-action.active { color: var(--mint); border-color: rgba(32,218,201,.46); background: rgba(32,218,201,.12); }

    .profile-hero {
      position: relative;
      aspect-ratio: 16 / 15;
      min-height: 420px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: 0 24px 60px rgba(0,0,0,.34), inset 0 0 0 1px rgba(150,255,215,.14);
    }
    .profile-hero img { object-position: center 31%; filter: saturate(1.06) contrast(1.04) brightness(.84); }
    .profile-share {
      position: absolute;
      top: 13px;
      right: 13px;
      z-index: 4;
      background: rgba(2,7,6,.74);
      backdrop-filter: blur(14px);
    }
    .profile-overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 3;
      display: grid;
      justify-items: start;
      gap: 9px;
    }
    .profile-overlay h1 { font-size: 44px; }
    .profile-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); gap: 7px; align-items: stretch; align-self: stretch; width: 100%; }
    .profile-actions .btn { min-width: 0; padding-left: 8px; padding-right: 8px; }
    .profile-actions .icon-btn { width: 40px; height: 43px; border-radius: var(--radius); }
    .profile-tags { display: flex; gap: 8px; flex-wrap: wrap; color: var(--soft); font-size: 12px; }
    .tabbar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 18px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
    }
    .tab {
      min-height: var(--touch-sm);
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }
    .tab.active { color: var(--mint); background: rgba(32,218,201,.12); }
    .profile-panel { display: grid; gap: 16px; margin-top: 18px; }
    .profile-summary { display: grid; gap: 8px; }
    .profile-summary b { font-size: 18px; }
    .profile-room {
      position: relative;
      min-height: 200px;
      border-radius: 18px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .profile-room img { object-position: center 54%; filter: saturate(1.02) brightness(.74); }

    .room-stage {
      position: relative;
      width: 100%;
      min-height: 420px;
      border-radius: 22px;
      overflow: hidden;
      background: #07100e;
      box-shadow: inset 0 0 0 1px rgba(150,255,215,.13);
    }
    .room-stage img { object-position: center 48%; filter: saturate(1.04) contrast(1.04) brightness(.68); }
    .room-overlay {
      position: absolute;
      inset: 16px 13px auto;
      z-index: 3;
      display: grid;
      justify-items: start;
      gap: 8px;
    }
    .room-overlay h2 { font-size: 35px; max-width: 9ch; }
    .room-host {
      border: 0;
      border-radius: var(--control-radius);
      color: var(--text);
      background: rgba(3,10,9,.72);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      text-align: left;
      backdrop-filter: blur(14px);
    }
    .room-host img { width: 46px; height: 46px; border-radius: 13px; object-fit: cover; filter: none; }
    .chat-list { display: grid; gap: 2px; border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); }
    .chat-line {
      display: grid;
      grid-template-columns: 66px 1fr;
      gap: 8px;
      padding: 9px 0;
      align-items: start;
    }
    .chat-line b { color: var(--mint); font-size: 11px; }
    .chat-line span { color: var(--soft); font-size: 12px; line-height: 1.35; }
    .room-sticky {
      position: sticky;
      bottom: calc(var(--bottom-nav-height) + var(--safe-bottom) + 14px);
      z-index: 9;
      margin-top: 16px;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 18px;
      border: 1px solid rgba(150,255,215,.18);
      background: rgba(3, 10, 9, .86);
      display: grid;
      gap: 9px;
      backdrop-filter: blur(18px);
    }
    .sticky-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--muted); font-size: 10px; font-weight: 900; text-transform: uppercase; }
    .sticky-top span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; }
    .sticky-actions { display: grid; grid-template-columns: 1fr 38px 38px; gap: 8px; }
    .qualifier { color: var(--muted); font-size: 10px; }
    .room-social {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .social-stat {
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
    }
    .social-stat b { display: block; color: var(--mint); font-size: 14px; }
    .social-stat span { color: var(--muted); font-size: 9.5px; line-height: 1.25; }
    .reaction-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .reaction-row .chip { min-height: 34px; }
    .viewer-stack { display: flex; align-items: center; min-height: 32px; }
    .viewer-stack img {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid #07100e;
      margin-left: -8px;
    }
    .viewer-stack img:first-child { margin-left: 0; }
    .live-events {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(150,255,215,.14);
      background: rgba(255,255,255,.04);
    }
    .event-line { display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--soft); font-size: 11px; }
    .event-line span:last-child { color: var(--muted); font-size: 9px; white-space: nowrap; }
    .chat-composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
    .chat-composer .field { min-height: 44px; resize: none; }
    .screen .chat-composer { margin-bottom: 84px; scroll-margin-bottom: 150px; }

      const dealerRows = dealerResults.map(d => { const s = activeSession(d); return `<button class="activity-row" type="button" data-profile="${d.id}"><img src="${d.avatar}" alt="${d.name} avatar"><div><b>${d.name}</b><span>${s.game} · ${s.operator} · ${s.status}</span></div></button>`; }).join("");
      const roomRows = roomResults.slice(0, 5).map(d => { const s = activeSession(d); return `<button class="activity-row" type="button" data-go="${s.status === "LIVE NOW" ? "live/" + d.id : "dealer/" + d.id}"><img src="${d.live || d.avatar}" alt="${d.room}"><div><b>${s.table}</b><span>${d.short} · ${s.game} · ${s.operator}</span></div></button>`; }).join("");
      return `<div class="sheet-head"><h3>Search</h3><button class="chip" type="button" data-close>Close</button></div><input class="search-input" data-search-input value="${escapeHtml(state.searchQuery || "")}" placeholder="Search dealers, games or live rooms" autocomplete="off"><div class="search-group">${recentDealers.length && !q ? '<span class="feed-label">Recent</span><div class="search-list">' + recentDealers.map(d => { const s = activeSession(d); return `<button class="activity-row" type="button" data-profile="${d.id}"><img src="${d.avatar}" alt="${d.name} avatar"><div><b>${d.name}</b><span>${s.game} · ${s.operator} · ${s.status}</span></div></button>`; }).join("") + '</div>' : ''}<span class="feed-label">Dealers</span><div class="search-list">${dealerRows || '<div class="empty-card">No dealer found.</div>'}</div><span class="feed-label">Games</span><div class="filter-row">${gameResults.map(g => `<button class="chip" type="button" data-filter="${g.toLowerCase()}" data-close>${g}</button>`).join("") || '<span class="empty-card">No game found.</span>'}</div><span class="feed-label">Live rooms</span><div class="search-list">${roomRows || '<div class="empty-card">No live room found.</div>'}</div></div>`;
    }
    function createPostSheet() {
      return `<div class="sheet-head"><h3>Create post</h3><button class="chip" type="button" data-close>Close</button></div><div class="form-grid"><textarea class="field" id="creator-post-text" maxlength="120" placeholder="What should followers know before the session?">Back at Blackjack tonight. Save the 20:00 table.</textarea><select class="field" id="creator-post-type"><option>PRE-LIVE</option><option>TABLE NOTE</option><option>SCHEDULE</option><option>HIGHLIGHT</option></select><select class="field" id="creator-post-image"><option value="content">Sofia social crop</option><option value="live">Live table crop</option><option value="profile">Profile crop</option></select><button class="btn" type="button" data-publish-post>Publish post</button><span class="demo-note">Illustrative post. It appears on the creator profile and follower surfaces.</span></div>`;
    }
    function publishCreatorPost() {
      const text = escapeHtml(document.getElementById("creator-post-text")?.value || "Sofia shared a table note for followers.");
      const type = document.getElementById("creator-post-type")?.value || "PRE-LIVE";
      const img = document.getElementById("creator-post-image")?.value || "content";
      const image = img === "live" ? assets.sofiaLive : img === "profile" ? assets.sofiaProfile : assets.sofiaContent;
      const id = `custom-${Date.now()}`;
      state.customPosts.unshift({ id, dealer: "sofia", type, section: type, title: text, image, action: "SAVE" });
      addUnique("followed", "sofia");
      addUnique("saved", "schedule-sofia");
      state.selectedPost = id;
      track("creator_post_publish");
      persist();
      closeSheet();
      render();
      toast("Post published");
    }
    function addCreatorSession() {
      if ((state.customSessions || []).some(s => s.id === "creator-demo-session")) {
        toast("Session already added");
        return;
      }
      state.customSessions.unshift({ id: "creator-demo-session", dealer: "sofia", day: "Tomorrow", time: "18:30-20:00", game: "Blackjack", table: "Creator Warmup", operator: "Demo Casino A", status: "UPCOMING" });
      addUnique("saved", "schedule-sofia");
      track("creator_schedule_add");
      persist();
      render();
      toast("Session added");
    }
    function sheet(type) {
      if (type === "notify") {
        state.notificationsRead = true;
        persist();
        track("notification_open");
      }
      const activePost = visiblePosts().find(p => p.id === state.selectedPost) || visiblePosts()[0];
      const activePostDealer = dealer(activePost.dealer);
      const activeSessionInfo = activeSession(activePostDealer);
      const handoffDealer = dealer(state.selectedDealer || activePost.dealer);
      const handoffSession = activeSession(handoffDealer);
      const content = {
        message: `<div class="sheet-head"><h3>Sofia Laurent</h3><button class="chip" type="button" data-close>Close</button></div><span class="pill soft">Private message</span><div class="chat-list"><div class="chat-line"><b>You</b><span>Are you live tomorrow?</span></div><div class="chat-line"><b>Sofia</b><span>Yes — 20:00. See you at the table.</span></div></div><div class="input-row">Message Sofia...</div>`,
        chat: `<div class="sheet-head"><h3>Chat</h3><button class="chip" type="button" data-close>Close</button></div><p>Send a quick table message.</p><div class="chat-composer"><textarea class="field" data-chat-input maxlength="90" placeholder="Message the room..."></textarea><button class="btn slim" type="button" data-send-chat>Send</button></div>`,
        content: `<div class="sheet-head"><h3>${activePostDealer.short}'s update</h3><button class="chip" type="button" data-close>Close</button></div><span class="pill soft">Illustrative content</span><p>${activePost.title}</p><p>${activeSessionInfo.game} · ${activeSessionInfo.operator} · ${activeSessionInfo.time}</p><div class="cta-row"><button class="btn slim" type="button" data-profile="${activePostDealer.id}">Dealer profile</button>${activeSessionInfo.status === "LIVE NOW" ? '<button class="btn slim secondary" type="button" data-go="live/' + activePostDealer.id + '">Watch live</button>' : '<button class="btn slim secondary" type="button" data-tab="schedule" data-profile="' + activePostDealer.id + '">View schedule</button>'}<button class="chip ${isSaved("schedule-" + activePostDealer.id) ? "active" : ""}" type="button" data-save="schedule-${activePostDealer.id}">${saveLabel("schedule-" + activePostDealer.id, "Remind me")}</button></div>`,
        operator: `<div class="sheet-head"><h3>Continue to Casino</h3><button class="chip" type="button" data-close>Close</button></div><span class="label">${handoffSession.game}</span><p><b>${handoffDealer.name}</b><br>${handoffSession.table} · ${handoffSession.operator}</p><button class="btn" type="button" data-close>Continue with operator</button><span class="demo-note">Illustrative operator/provider handoff. LC App does not process real-money wagering, player funds, KYC/AML or settlement. No confirmed integration is implied.</span>`,
        info: `<div class="sheet-head"><h3>Product info</h3><button class="chip" type="button" data-close>Close</button></div><p>LC App is a social discovery and engagement layer for Live Casino. Real-money gaming, player funds, KYC/AML, responsible gaming controls and game settlement remain with licensed operators/providers.</p><span class="trust-line">18+ · Demo environment · No real-money wagering in LC App.</span>`,
        notify: `<div class="sheet-head"><h3>Notifications</h3><button class="chip" type="button" data-close>Close</button></div><span class="feed-label">Today</span><div><button class="notification-card" type="button" data-go="live/sofia"><i></i><div><b>Sofia is live now</b><span>${activeSession(dealer("sofia")).game} · ${activeSession(dealer("sofia")).operator}</span></div><span>${icons.live}</span></button><button class="notification-card" type="button" data-profile="alex"><i></i><div><b>Alex starts soon</b><span>${activeSession(dealer("alex")).game} · ${activeSession(dealer("alex")).time}</span></div><span>${icons.user}</span></button><button class="notification-card" type="button" data-post="${visiblePosts()[0].id}"><i></i><div><b>Sofia posted</b><span>Saved followers see the update</span></div><span>${icons.msg}</span></button></div><span class="feed-label">Earlier</span><div><button class="notification-card read" type="button" data-post="p3"><i></i><div><b>Mia posted</b><span>${activeSession(dealer("mia")).game} · ${activeSession(dealer("mia")).operator}</span></div><span>${icons.msg}</span></button></div>`,
        search: searchSheet(),
        createPost: createPostSheet(),
        authGate: `<div class="sheet-head"><h3>Sign in to personalize LC App</h3><button class="chip" type="button" data-close>Close</button></div><p>Follow creators, save reminders, chat and receive return notifications with your LC App profile.</p><button class="btn" type="button" data-auth-preview>Preview signed-in state</button><span class="demo-note">Review demo only. Real auth and social permissions remain handled by the live Supabase flow.</span>`
      }[type];
      $("sheet").innerHTML = content || "";
      $("sheet").classList.add("open");
    }
    let lastRenderedRoute = "";
    function closeSheet() { $("sheet").classList.remove("open"); }
    function render() {
      const active = route();
      if (lastRenderedRoute && active !== lastRenderedRoute) closeSheet();
      const protectedRoute = ["following", "player", "creator"].includes(active) && !state.identityPreview;
      const visible = protectedRoute ? "welcome" : active;
      $("app").dataset.route = visible;
      Object.keys(screens).forEach(id => $(id).classList.toggle("active", id === visible));
      screens[visible]();
      if (protectedRoute) sheet("authGate");
      document.querySelectorAll(".nav").forEach(btn => {
        const r = btn.dataset.go;
        btn.classList.toggle("active", r === visible);
        btn.innerHTML = `${r === "discover" ? icons.discover : r === "live" ? icons.live : r === "following" ? icons.following : icons.user}<span>${r === "discover" ? "Discover" : r === "live" ? "Live" : r === "following" ? "Following" : "Profile"}</span>`;
      });
      const side = sideCopy[visible] || sideCopy.discover;
      const kicker = document.getElementById("side-kicker");
      if (kicker) {
        kicker.textContent = side[0];
        document.getElementById("side-title").textContent = side[1];
        document.getElementById("side-copy").textContent = side[2];
      }
      lastRenderedRoute = active;
    }
    document.addEventListener("click", (e) => {
      const g = e.target.closest("[data-go]");
      const f = e.target.closest("[data-follow]");
      const l = e.target.closest("[data-like]");
      const react = e.target.closest("[data-react]");
      const s = e.target.closest("[data-save]");
      const p = e.target.closest("[data-profile]");
      const filter = e.target.closest("[data-filter]");
      const share = e.target.closest("[data-share]");
      const post = e.target.closest("[data-post]");
      const creatorAction = e.target.closest("[data-creator]");
      const publishPost = e.target.closest("[data-publish-post]");
      const sh = e.target.closest("[data-sheet]");
      const authPreview = e.target.closest("[data-auth-preview]");
      const sendChat = e.target.closest("[data-send-chat]");
      const calendar = e.target.closest("[data-calendar]");
      const c = e.target.closest("[data-comment]");
      const t = e.target.closest("[data-tab]");
      const close = e.target.closest("[data-close]");
      if (authPreview) {
        state.identityPreview = true;
        persist();
        closeSheet();
        render();
        toast("Signed-in preview active");
        return;
      }
      if (g) {
        if (["following", "player", "creator"].includes(g.dataset.go) && requireIdentity()) return;
        go(g.dataset.go);
      }
      if (g?.dataset.go === "discover") track("explore_click");
      if (g?.dataset.go === "industry") track("how_it_works_open");
      if (f) {
        if (requireIdentity()) return;
        track("follow_attempt");
        const id = f.dataset.follow;
        const set = new Set(state.followed);
        set.has(id) ? set.delete(id) : set.add(id);
        state.followed = [...set];
        if (state.followed.includes(id)) addUnique("saved", "return-" + id);
        persist();
        render();
        track("follow_success");
        toast(state.followed.includes(id) ? "Following · reminder ready" : "Unfollowed");
      }
      if (l) { if (requireIdentity()) return; toggle("liked", l.dataset.like); toast(state.liked.includes(l.dataset.like) ? "Liked" : "Like removed"); }
      if (react) {
        if (requireIdentity()) return;
        const [dealerId, label] = react.dataset.react.split(":");
        state.reactions = { ...(state.reactions || {}), [react.dataset.react]: Number((state.reactions || {})[react.dataset.react] || 0) + 1 };
        state.liveEvents = [{ dealer: dealerId, text: `You reacted: ${label}` }, ...(state.liveEvents || [])].slice(0, 8);
        persist();
        render();
        toast("Reaction added");
      }
      if (s) { if (requireIdentity()) return; toggle("saved", s.dataset.save); toast(state.saved.includes(s.dataset.save) ? "Reminder saved" : "Removed from saved"); }
      if (p) { rememberDealer(p.dataset.profile); go("dealer/" + p.dataset.profile); }
      if (filter) { state.discoverFilter = filter.dataset.filter; persist(); track("discover_filter"); render(); }
      if (share) shareProfile(share.dataset.share);
      if (post) {
        state.selectedPost = post.dataset.post;
        addRecent("content", post.dataset.post);
        persist();
        track("content_open");
        sheet("content");
      }
      if (creatorAction) {
        if (requireIdentity()) return;
        const action = creatorAction.dataset.creator;
        if (action === "note" && !state.creatorNotes.some(n => n.id === "creator-note-sofia-1")) {
          state.creatorNotes.unshift({ id: "creator-note-sofia-1", title: "Sofia shared a table note for followers before tonight's session." });
          track("creator_note_add");
          persist();
          render();
          toast("Creator note added");
        }
        if (action === "schedule") {
          ["schedule-sofia", "return-sofia"].forEach(id => { if (!state.saved.includes(id)) state.saved.push(id); });
          persist();
          render();
          toast("Session saved");
        }
        if (action === "add-session") addCreatorSession();
      }
      if (publishPost) { if (requireIdentity()) return; publishCreatorPost(); }
      if (sh) {
        if (["notify", "message", "chat", "createPost"].includes(sh.dataset.sheet) && requireIdentity()) return;
        if (sh.dataset.sheet === "operator") track("operator_handoff_click");
        if (sh.dataset.sheet === "search") track("search_open");
        sheet(sh.dataset.sheet);
      }
      if (calendar) { if (requireIdentity()) return; saveCalendar(calendar.dataset.calendar); }
      if (sendChat) {
        if (requireIdentity()) return;
        const input = document.querySelector("[data-chat-input]");
        const msg = escapeHtml(input?.value?.trim() || "See you at 20:00.");
        state.comments.push(msg);
        state.liveEvents = [{ dealer: state.selectedDealer || "sofia", text: "You messaged the room" }, ...(state.liveEvents || [])].slice(0, 8);
        persist();
        closeSheet();
        render();
        toast("Message sent");
      }
      if (c) { if (requireIdentity()) return; state.comments.push(c.dataset.comment); persist(); closeSheet(); render(); toast("Message sent"); }
      if (t) {
        state.tab = t.dataset.tab;
        if (state.tab === "schedule") addRecent("schedule", state.selectedDealer || "sofia");
        persist();
        render();
      }
      if (close) closeSheet();
    });
    document.addEventListener("input", (e) => {
      const input = e.target.closest("[data-search-input]");
      if (!input) return;
      state.searchQuery = input.value;
      persist();
      track("search_query");
      $("sheet").innerHTML = searchSheet();
      $("sheet").classList.add("open");
      const next = document.querySelector("[data-search-input]");
      if (next) {
        next.focus();
        next.setSelectionRange(next.value.length, next.value.length);
      }
    });
    window.addEventListener("hashchange", render);
    document.addEventListener("error", (e) => {
      if (e.target?.tagName !== "IMG" || e.target.dataset.fallback) return;
      e.target.dataset.fallback = "true";
      e.target.alt = e.target.alt || "LC App visual fallback";
      e.target.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#07140f"/><text x="50%" y="48%" text-anchor="middle" fill="#96ffd7" font-family="Arial" font-size="42" font-weight="700">LC App</text><text x="50%" y="56%" text-anchor="middle" fill="#f7fffb" font-family="Arial" font-size="22">Interactive product demo</text></svg>');
    }, true);
    if (!sessionStorage.getItem("lc-demo-opened")) {
      sessionStorage.setItem("lc-demo-opened", "1");
      track("demo_open");
    }
    render();
  </script>
</body>
</html>
